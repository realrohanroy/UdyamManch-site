<head>

<style>
:root{--bg:#f1f3fa;--ink:#13122b;--mute:#5d5c78;--line:#d6d9ea;--card:#fff;--acc:#5252a6;--acc2:#4fb8ee;--soft:#e3e6f6;--hd:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--bd:'Newsreader',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d1f;--ink:#eceaff;--mute:#a09fc0;--line:#28274a;--card:#16152e;--acc:#9c9bf2;--acc2:#5fc3f5;--soft:#1d1c3c}}
:root[data-theme="dark"]{--bg:#0e0d1f;--ink:#eceaff;--mute:#a09fc0;--line:#28274a;--card:#16152e;--acc:#9c9bf2;--acc2:#5fc3f5;--soft:#1d1c3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--bd);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--hd);line-height:1.05;margin:0;letter-spacing:-.025em}
.w{max-width:1240px;margin:0 auto;padding:0 24px}
.meta{font:500 13.5px/1.4 var(--hd);color:var(--mute)}
.cat{font:700 13.5px var(--hd);color:var(--acc)}
.btn{display:inline-block;font:700 15px var(--hd);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 22px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font:800 22px var(--hd);letter-spacing:-.03em}
.lgd,.logo .lgd,footer .lgd{display:none}

.logo img,footer img{display:block;width:auto}footer .w>div:first-child img{margin-bottom:6px}
nav{display:flex;gap:22px;margin-left:auto;font:600 15px var(--hd)}

#pg{position:fixed;top:0;left:0;height:3px;background:var(--acc2);width:0;z-index:30}
/* hero */
.hero{display:grid;grid-template-columns:7fr 5fr;gap:40px;padding:36px 0 28px}
.lead .art{aspect-ratio:16/11;border-radius:4px 4px 90px 4px}
.lead h1{font-size:clamp(38px,5.2vw,72px);margin:20px 0 14px;font-weight:800}
.dek{font-size:21px;color:var(--mute);line-height:1.45;margin:0 0 14px;max-width:34em}
.side{display:flex;flex-direction:column;gap:26px}

.sup h3{font-size:26px;margin:6px 0 8px}

.sup p{margin:0;color:var(--mute);font-size:16.5px;line-height:1.45}
.trend{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:56px}
.trend a{padding:16px 18px 16px 0;display:flex;gap:12px}
.trend a+a{padding-left:18px;border-left:1px solid var(--line)}
.trend b{font:800 30px/1 var(--hd);color:var(--acc2)}

.art{display:block;overflow:hidden;position:relative}.art svg{display:block;width:100%;height:100%}
.bars rect{transform-origin:bottom;transform-box:fill-box;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}

.fig2{aspect-ratio:21/8;border-radius:4px 4px 4px 70px;overflow:hidden;margin-bottom:10px}.fig2 .art{height:100%}
.cap{font:500 13px var(--hd);color:var(--mute);margin-top:8px}
/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 22px;padding-top:6px}
.sec h2{font-size:clamp(28px,3.4vw,42px);font-weight:800}
.sec a{font:700 15px var(--hd);color:var(--acc);border-bottom:2px solid var(--acc2)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;margin-bottom:64px}
.feed a{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}

.rows a{display:grid;grid-template-columns:1.2fr 2fr 1fr 70px;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}

.news form{display:flex;gap:8px;flex-wrap:wrap}

footer{border-top:1px solid var(--line);padding:36px 0 56px;color:var(--mute);font:500 14.5px/1.6 var(--hd)}

/* article */
.art-h{max-width:900px;margin:0 auto;padding:44px 24px 0}

.by{display:flex;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:22px;flex-wrap:wrap}

.fig{max-width:1100px;margin:32px auto 0;padding:0 24px}
.fig .art{aspect-ratio:21/9;border-radius:4px 4px 4px 80px}
.body{max-width:680px;margin:40px auto 0;padding:0 24px;font-size:20.5px;line-height:1.75}
.body p{margin:0 0 1.3em}
.body p:first-child::first-letter{font:800 5.2em/.8 var(--hd);float:left;padding:8px 12px 0 0;color:var(--acc)}
.body h2{font-size:30px;margin:1.6em 0 .6em}
.pq{margin:1.8em -90px;padding:6px 0 6px 28px;border-left:5px solid var(--acc2);font:italic 400 34px/1.25 var(--bd)}
.note{font:500 14px var(--hd);color:var(--mute);background:var(--soft);padding:12px 16px;border-radius:8px;margin:2em 0}
.rel{max-width:1100px;margin:70px auto;padding:0 24px}

.ph{padding:44px 0 24px}.ph h1{font-size:clamp(40px,6vw,80px);font-weight:800}.ph p{max-width:36em;color:var(--mute);font-size:20px;margin:14px 0 0}
.tools{display:flex;gap:12px;flex-wrap:wrap;padding:16px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);position:sticky;top:68px;background:var(--bg);z-index:5;align-items:center}
.tools input{flex:1 1 240px}
.chips{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.chip{font:600 14px var(--hd);border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}

.dir a{display:grid;grid-template-columns:2.2fr 1fr 1fr 70px;gap:22px;padding:20px 0;border-bottom:1px solid var(--line);align-items:start}
.dir h3{font-size:26px}.dir p{margin:4px 0 0;color:var(--mute);font-size:16.5px;line-height:1.4}
.dir a:hover h3{color:var(--acc)}
.cnt{font:600 14px var(--hd);color:var(--mute);padding:14px 0}
.empty{padding:50px 0;font-size:20px;color:var(--mute)}
.prof{display:grid;grid-template-columns:1.7fr 1fr;gap:56px;padding:20px 0 60px}
dl{margin:0;border-top:2px solid var(--ink)}dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
dt{font:500 14px var(--hd);color:var(--mute)}dd{margin:0;font:700 15px var(--hd);text-align:right}
.steps{counter-reset:s;list-style:none;padding:0;margin:30px 0;max-width:760px}
.steps li{counter-increment:s;display:grid;grid-template-columns:54px 1fr;padding:18px 0;border-bottom:1px solid var(--line);font-size:19px}
.steps li::before{content:counter(s);font:800 30px/1 var(--hd);color:var(--acc2)}
.steps b{font-family:var(--hd)}
/* motion */
body,header,input,select,.chip,.quote,.news,.tools{transition:background-color .35s,color .35s,border-color .35s}
header{transition:transform .35s,background-color .35s}header.hide{transform:translateY(-100%)}
.tools{transition:top .35s,background-color .35s}header.hide~main .tools{top:0}
#m{animation:pgin .55s cubic-bezier(.2,.7,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateY(12px)}}
.w1{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.w1>i{display:inline-block;font-style:normal;transform:translateY(108%);animation:wup .85s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.2s + var(--k)*.055s)}
@keyframes wup{to{transform:none}}
.lead .art,.fig .art,.fig2{animation:wipe 1.1s cubic-bezier(.7,0,.2,1) both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.art img{transition:transform 1.3s cubic-bezier(.2,.7,.2,1)}a:hover .art img,.art:hover img{transform:scale(1.06)}
.feed a,.rows a,.dir a{transition:padding .3s}.feed a:hover,.rows a:hover,.dir a:hover{padding-left:12px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.pq{border-left:0;position:relative}.pq::before{content:"";position:absolute;left:0;top:0;width:5px;height:0;background:var(--acc2);transition:height 1.1s .25s cubic-bezier(.2,.7,.2,1)}.pq.in::before{height:100%}
@keyframes rowin{from{opacity:0;transform:translateY(8px)}}
.btn{transition:transform .25s,background-color .25s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:none}
.chip{transition:background-color .25s,color .25s,border-color .25s,transform .2s}.chip:active{transform:scale(.95)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.w1>i{transform:none}.rv{opacity:1;transform:none}.pq::before{height:100%}}
@media(max-width:900px){
.hero,.two,.news,.prof{grid-template-columns:1fr}.trend{grid-template-columns:1fr 1fr}.trend a:nth-child(3){border-left:0;padding-left:0}
.pq{margin:1.6em 0;font-size:27px}.rel .g{grid-template-columns:1fr}
.rows a,.dir a{grid-template-columns:1fr auto;gap:6px}.rows a p,.dir a p{grid-column:1/-1}
nav{display:none}.bar{gap:12px}.logo{margin-right:auto}.news{padding:30px}.sup{grid-template-columns:1fr 100px}
body{font-size:17px}.body{font-size:19px}
}
@media(prefers-reduced-motion:reduce){.bars rect{animation:none}}
</style>

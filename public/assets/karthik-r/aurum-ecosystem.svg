<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="675" fill="#16152E"/>
  <!-- connectors -->
  <g stroke="#5455A5" stroke-width="4" stroke-dasharray="10 10" fill="none">
    <line x1="600" y1="337" x2="270" y2="170"/>
    <line x1="600" y1="337" x2="930" y2="170"/>
    <line x1="600" y1="337" x2="270" y2="505"/>
    <line x1="600" y1="337" x2="930" y2="505"/>
  </g>
  <!-- hub -->
  <circle cx="600" cy="337" r="125" fill="#F5B82E"/>
  <circle cx="600" cy="337" r="125" fill="none" stroke="#FFE08A" stroke-width="6"/>
  <text x="600" y="342" text-anchor="middle" font-size="31" font-weight="700" fill="#4A2F00">AurumCrypto</text>
  <text x="600" y="380" text-anchor="middle" font-size="22" fill="#4A2F00">one ecosystem</text>
  <!-- four parts -->
  <g>
    <rect x="60" y="100" width="420" height="140" rx="10" fill="#1D1C3C" stroke="#9C9BF2" stroke-width="3"/>
    <text x="90" y="156" font-size="29" font-weight="700" fill="#ECEAFF">Automated AI management</text>
    <text x="90" y="200" font-size="26" fill="#A09FC0">Data drives the decisions</text>
  </g>
  <g>
    <rect x="720" y="100" width="420" height="140" rx="10" fill="#1D1C3C" stroke="#9C9BF2" stroke-width="3"/>
    <text x="750" y="156" font-size="29" font-weight="700" fill="#ECEAFF">AI-Trader EX</text>
    <text x="750" y="200" font-size="26" fill="#A09FC0">Risk control, 24/7</text>
  </g>
  <g>
    <rect x="60" y="435" width="420" height="140" rx="10" fill="#1D1C3C" stroke="#9C9BF2" stroke-width="3"/>
    <text x="90" y="491" font-size="29" font-weight="700" fill="#ECEAFF">Aurum Wallet</text>
    <text x="90" y="535" font-size="26" fill="#A09FC0">Web3 security, AES-256</text>
  </g>
  <g>
    <rect x="720" y="435" width="420" height="140" rx="10" fill="#1D1C3C" stroke="#9C9BF2" stroke-width="3"/>
    <text x="750" y="491" font-size="29" font-weight="700" fill="#ECEAFF">Aurum Academy</text>
    <text x="750" y="535" font-size="26" fill="#A09FC0">Learning for new investors</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="675" fill="#16152E"/>
  <!-- three signals -->
  <g>
    <rect x="70" y="95" width="400" height="130" rx="10" fill="#1D1C3C" stroke="#9C9BF2" stroke-width="3"/>
    <text x="100" y="150" font-size="34" font-weight="700" fill="#ECEAFF">Market sentiment</text>
    <text x="100" y="192" font-size="24" fill="#A09FC0">How the crowd feels</text>
  </g>
  <g>
    <rect x="70" y="272" width="400" height="130" rx="10" fill="#1D1C3C" stroke="#9C9BF2" stroke-width="3"/>
    <text x="100" y="327" font-size="34" font-weight="700" fill="#ECEAFF">Whale movements</text>
    <text x="100" y="369" font-size="24" fill="#A09FC0">Very large holders on the move</text>
  </g>
  <g>
    <rect x="70" y="449" width="400" height="130" rx="10" fill="#1D1C3C" stroke="#9C9BF2" stroke-width="3"/>
    <text x="100" y="504" font-size="34" font-weight="700" fill="#ECEAFF">Liquidity shifts</text>
    <text x="100" y="546" font-size="24" fill="#A09FC0">How easily trades can happen</text>
  </g>
  <!-- arrows into the system -->
  <g stroke="#F5B82E" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M480 160 L640 300"/><path d="M480 337 L640 337"/><path d="M480 514 L640 374"/>
  </g>
  <g fill="#F5B82E"><polygon points="652,310 626,296 636,282"/><polygon points="656,337 632,324 632,350"/><polygon points="652,364 636,392 626,378"/></g>
  <!-- the system -->
  <circle cx="860" cy="337" r="190" fill="#F5B82E"/>
  <circle cx="860" cy="337" r="190" fill="none" stroke="#FFE08A" stroke-width="6"/>
  <text x="860" y="312" text-anchor="middle" font-size="42" font-weight="700" fill="#4A2F00">A 24/7 AI</text>
  <text x="860" y="362" text-anchor="middle" font-size="42" font-weight="700" fill="#4A2F00">system that</text>
  <text x="860" y="412" text-anchor="middle" font-size="42" font-weight="700" fill="#4A2F00">adapts</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" width="900" height="720">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.55" stop-color="#F5B82E"/>
      <stop offset="1" stop-color="#D98E04"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6D6FC4"/>
      <stop offset="1" stop-color="#3B3F9E"/>
    </linearGradient>
  </defs>
  <!-- soft glow behind the frames -->
  <circle cx="450" cy="360" r="300" fill="url(#gold)" opacity="0.18"/>
  <!-- three storyboard frames -->
  <g fill="#FFFFFF" stroke="#3B3F9E" stroke-width="6">
    <rect x="70" y="210" width="240" height="180" rx="14"/>
    <rect x="330" y="210" width="240" height="180" rx="14"/>
    <rect x="590" y="210" width="240" height="180" rx="14"/>
  </g>
  <!-- film sprocket holes above and below -->
  <g fill="#3B3F9E" opacity="0.85">
    <rect x="90" y="176" width="26" height="18" rx="4"/><rect x="150" y="176" width="26" height="18" rx="4"/><rect x="210" y="176" width="26" height="18" rx="4"/><rect x="270" y="176" width="26" height="18" rx="4"/>
    <rect x="350" y="176" width="26" height="18" rx="4"/><rect x="410" y="176" width="26" height="18" rx="4"/><rect x="470" y="176" width="26" height="18" rx="4"/><rect x="530" y="176" width="26" height="18" rx="4"/>
    <rect x="610" y="176" width="26" height="18" rx="4"/><rect x="670" y="176" width="26" height="18" rx="4"/><rect x="730" y="176" width="26" height="18" rx="4"/><rect x="790" y="176" width="26" height="18" rx="4"/>
    <rect x="90" y="406" width="26" height="18" rx="4"/><rect x="150" y="406" width="26" height="18" rx="4"/><rect x="210" y="406" width="26" height="18" rx="4"/><rect x="270" y="406" width="26" height="18" rx="4"/>
    <rect x="350" y="406" width="26" height="18" rx="4"/><rect x="410" y="406" width="26" height="18" rx="4"/><rect x="470" y="406" width="26" height="18" rx="4"/><rect x="530" y="406" width="26" height="18" rx="4"/>
    <rect x="610" y="406" width="26" height="18" rx="4"/><rect x="670" y="406" width="26" height="18" rx="4"/><rect x="730" y="406" width="26" height="18" rx="4"/><rect x="790" y="406" width="26" height="18" rx="4"/>
  </g>
  <!-- the bounce path, dashed like a pencil guide -->
  <path d="M120 250 Q170 250 190 360 Q240 240 300 250 Q400 240 450 360 Q500 240 560 250 Q660 240 710 360 Q750 270 790 262" fill="none" stroke="#5455A5" stroke-width="4" stroke-dasharray="10 12" opacity="0.55"/>
  <!-- onion skin: fading copies of the ball along the path -->
  <g fill="url(#gold)">
    <circle cx="150" cy="268" r="16" opacity="0.25"/>
    <circle cx="190" cy="350" r="18" opacity="0.45"/>
    <ellipse cx="450" cy="362" rx="26" ry="16" opacity="0.7"/>
    <circle cx="400" cy="262" r="20" opacity="0.4"/>
    <circle cx="660" cy="262" r="20" opacity="0.55"/>
    <circle cx="710" cy="350" r="22" opacity="0.85"/>
  </g>
  <!-- the ball in its final frame -->
  <circle cx="786" cy="270" r="30" fill="url(#gold)"/>
  <circle cx="776" cy="260" r="9" fill="#FFF3C4" opacity="0.9"/>
  <!-- play button -->
  <g transform="translate(450 560)">
    <circle r="62" fill="url(#ink)"/>
    <path d="M-18 -30 L34 0 L-18 30 Z" fill="#FFE08A"/>
  </g>
  <!-- pencil -->
  <g transform="translate(120 600) rotate(-35)">
    <rect x="0" y="-14" width="190" height="28" rx="4" fill="#F5B82E"/>
    <rect x="0" y="-14" width="30" height="28" rx="4" fill="#E0457B"/>
    <rect x="26" y="-14" width="14" height="28" fill="#9C9BF2"/>
    <path d="M190 -14 L232 0 L190 14 Z" fill="#FFE08A"/>
    <path d="M220 -4 L232 0 L220 4 Z" fill="#3B3F9E"/>
  </g>
  <!-- small stars for the brand mood -->
  <g fill="#5455A5" opacity="0.65">
    <circle cx="720" cy="110" r="9"/><circle cx="790" cy="140" r="6"/><circle cx="160" cy="110" r="8"/>
    <circle cx="760" cy="560" r="8"/><circle cx="820" cy="610" r="5"/>
  </g>
</svg>

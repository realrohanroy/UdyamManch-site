<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Udyam Manch</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Caveat:wght@600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
:root{--bg:#f1f3fa;--ink:#13122b;--mute:#5d5c78;--line:#d6d9ea;--card:#fff;--acc:#5252a6;--acc2:#4fb8ee;--soft:#e3e6f6;--hd:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;--bd:'Newsreader',Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d1f;--ink:#eceaff;--mute:#a09fc0;--line:#28274a;--card:#16152e;--acc:#9c9bf2;--acc2:#5fc3f5;--soft:#1d1c3c}}
:root[data-theme="dark"]{--bg:#0e0d1f;--ink:#eceaff;--mute:#a09fc0;--line:#28274a;--card:#16152e;--acc:#9c9bf2;--acc2:#5fc3f5;--soft:#1d1c3c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 18px/1.6 var(--bd);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--hd);line-height:1.05;margin:0;letter-spacing:-.025em}
.w{max-width:1240px;margin:0 auto;padding:0 24px}
.meta{font:500 13.5px/1.4 var(--hd);color:var(--mute)}
.cat{font:700 13.5px var(--hd);color:var(--acc)}
.btn{display:inline-block;font:700 15px var(--hd);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 22px;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
/* header */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:28px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font:800 22px var(--hd);letter-spacing:-.03em}
.lgd,.logo .lgd,footer .lgd{display:none}
:root[data-theme="dark"] .lgd{display:block}:root[data-theme="dark"] .lgl{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .lgd{display:block}:root:not([data-theme="light"]) .lgl{display:none}}
.logo img,footer img{display:block;width:auto}footer .w>div:first-child img{margin-bottom:6px}
nav{display:flex;gap:22px;margin-left:auto;font:600 15px var(--hd)}
nav a{padding:6px 0;border-bottom:2px solid transparent}
nav a.on,nav a:hover{border-color:var(--acc)}
#tg{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center}
#tg .sun{display:none}
:root[data-theme="dark"] #tg .sun{display:block}:root[data-theme="dark"] #tg .moon{display:none}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) #tg .sun{display:block}:root:not([data-theme="light"]) #tg .moon{display:none}}
#pg{position:fixed;top:0;left:0;height:3px;background:var(--acc2);width:0;z-index:30}
/* hero */
.hero{display:grid;grid-template-columns:7fr 5fr;gap:40px;padding:36px 0 28px}
.lead .art{aspect-ratio:16/11;border-radius:4px 4px 90px 4px}
.lead h1{font-size:clamp(38px,5.2vw,72px);margin:20px 0 14px;font-weight:800}
.dek{font-size:21px;color:var(--mute);line-height:1.45;margin:0 0 14px;max-width:34em}
.side{display:flex;flex-direction:column;gap:26px}
.sup{display:grid;grid-template-columns:1fr 150px;gap:18px;padding-bottom:26px;border-bottom:1px solid var(--line)}
.sup h3{font-size:26px;margin:6px 0 8px}
.sup .art{aspect-ratio:1;border-radius:50% 4px 4px 4px;align-self:start}
.sup p{margin:0;color:var(--mute);font-size:16.5px;line-height:1.45}
.trend{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:56px}
.trend a{padding:16px 18px 16px 0;display:flex;gap:12px}
.trend a+a{padding-left:18px;border-left:1px solid var(--line)}
.trend b{font:800 30px/1 var(--hd);color:var(--acc2)}
.trend span{font:600 16px/1.25 var(--hd)}
.art{display:block;overflow:hidden;position:relative}.art svg{display:block;width:100%;height:100%}
.bars rect{transform-origin:bottom;transform-box:fill-box;animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.bars rect:nth-child(2){animation-delay:.12s}.bars rect:nth-child(3){animation-delay:.24s}
@keyframes rise{from{transform:scaleY(.05)}to{transform:none}}
.fig2{aspect-ratio:21/8;border-radius:4px 4px 4px 70px;overflow:hidden;margin-bottom:10px}.fig2 .art{height:100%}
.cap{font:500 13px var(--hd);color:var(--mute);margin-top:8px}
/* sections */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:0 0 22px;padding-top:6px}
.sec h2{font-size:clamp(28px,3.4vw,42px);font-weight:800}
.sec a{font:700 15px var(--hd);color:var(--acc);border-bottom:2px solid var(--acc2)}
.two{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;margin-bottom:64px}
.feed a{display:grid;grid-template-columns:78px 1fr;gap:14px;padding:15px 0;border-bottom:1px solid var(--line)}
.feed a:first-child{border-top:1px solid var(--line)}
.feed h3{font-size:21px;margin:2px 0 0;font-weight:700;letter-spacing:-.015em}
.feed a:hover h3,.rows a:hover h3{color:var(--acc)}
.quote{background:var(--ink);color:var(--bg);padding:34px;border-radius:4px 60px 4px 4px;align-self:start}
.quote p{font:italic 400 28px/1.3 var(--bd);margin:0 0 20px}
.quote .who{display:flex;gap:12px;align-items:center;font:600 15px var(--hd)}
.pt{border-radius:50%;display:grid;place-items:center;color:#fff;font:800 16px var(--hd);flex:none}
.rows a{display:grid;grid-template-columns:1.2fr 2fr 1fr 70px;gap:20px;padding:18px 0;border-bottom:1px solid var(--line);align-items:baseline}
.rows h3{font-size:24px}
.rows p{margin:0;color:var(--mute);font-size:16.5px;line-height:1.4}
.news{background:var(--soft);border-radius:4px 4px 4px 90px;padding:48px;margin:70px 0;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.news h2{font-size:clamp(28px,3.6vw,46px);font-weight:800}
.news p{margin:12px 0 0;color:var(--mute);font-size:17px;line-height:1.5}
.news form{display:flex;gap:8px;flex-wrap:wrap}
input,select{font:500 16px var(--hd);color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.news input{flex:1 1 220px}
footer{border-top:1px solid var(--line);padding:36px 0 56px;color:var(--mute);font:500 14.5px/1.6 var(--hd)}
footer .w{display:flex;gap:30px;flex-wrap:wrap;justify-content:space-between}
/* article */
.art-h{max-width:900px;margin:0 auto;padding:44px 24px 0}
.art-h h1{font-size:clamp(38px,6vw,76px);font-weight:800;margin:12px 0 18px}
.by{display:flex;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:22px;flex-wrap:wrap}
.by .grow{flex:1}
.fig{max-width:1100px;margin:32px auto 0;padding:0 24px}
.fig .art{aspect-ratio:21/9;border-radius:4px 4px 4px 80px}
.body{max-width:680px;margin:40px auto 0;padding:0 24px;font-size:20.5px;line-height:1.75}
.body p{margin:0 0 1.3em}
.body p:first-child::first-letter{font:800 5.2em/.8 var(--hd);float:left;padding:8px 12px 0 0;color:var(--acc)}
.body h2{font-size:30px;margin:1.6em 0 .6em}
.pq{margin:1.8em -90px;padding:6px 0 6px 28px;border-left:5px solid var(--acc2);font:italic 400 34px/1.25 var(--bd)}
.note{font:500 14px var(--hd);color:var(--mute);background:var(--soft);padding:12px 16px;border-radius:8px;margin:2em 0}
.rel{max-width:1100px;margin:70px auto;padding:0 24px}
.rel .g{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}
.rel .art{aspect-ratio:3/2;margin-bottom:12px;border-radius:4px}
.rel h3{font-size:22px;margin-top:4px}
/* directory */
.ph{padding:44px 0 24px}.ph h1{font-size:clamp(40px,6vw,80px);font-weight:800}.ph p{max-width:36em;color:var(--mute);font-size:20px;margin:14px 0 0}
.tools{display:flex;gap:12px;flex-wrap:wrap;padding:16px 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line);position:sticky;top:68px;background:var(--bg);z-index:5;align-items:center}
.tools input{flex:1 1 240px}
.chips{display:flex;gap:8px;flex-wrap:wrap;width:100%}
.chip{font:600 14px var(--hd);border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.dir a{display:grid;grid-template-columns:2.2fr 1fr 1fr 70px;gap:22px;padding:20px 0;border-bottom:1px solid var(--line);align-items:start}
.dir h3{font-size:26px}.dir p{margin:4px 0 0;color:var(--mute);font-size:16.5px;line-height:1.4}
.dir a:hover h3{color:var(--acc)}
.cnt{font:600 14px var(--hd);color:var(--mute);padding:14px 0}
.empty{padding:50px 0;font-size:20px;color:var(--mute)}
.prof{display:grid;grid-template-columns:1.7fr 1fr;gap:56px;padding:20px 0 60px}
dl{margin:0;border-top:2px solid var(--ink)}dl div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
dt{font:500 14px var(--hd);color:var(--mute)}dd{margin:0;font:700 15px var(--hd);text-align:right}
.steps{counter-reset:s;list-style:none;padding:0;margin:30px 0;max-width:760px}
.steps li{counter-increment:s;display:grid;grid-template-columns:54px 1fr;padding:18px 0;border-bottom:1px solid var(--line);font-size:19px}
.steps li::before{content:counter(s);font:800 30px/1 var(--hd);color:var(--acc2)}
.steps b{font-family:var(--hd)}
/* motion */
body,header,input,select,.chip,.quote,.news,.tools{transition:background-color .35s,color .35s,border-color .35s}
header{transition:transform .35s,background-color .35s}header.hide{transform:translateY(-100%)}
.tools{transition:top .35s,background-color .35s}header.hide~main .tools{top:0}
#m{animation:pgin .55s cubic-bezier(.2,.7,.2,1)}
@keyframes pgin{from{opacity:0;transform:translateY(12px)}}
.w1{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.w1>i{display:inline-block;font-style:normal;transform:translateY(108%);animation:wup .85s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.2s + var(--k)*.055s)}
@keyframes wup{to{transform:none}}
.lead .art,.fig .art,.fig2{animation:wipe 1.1s cubic-bezier(.7,0,.2,1) both}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0)}}
.art img{transition:transform 1.3s cubic-bezier(.2,.7,.2,1)}a:hover .art img,.art:hover img{transform:scale(1.06)}
.feed a,.rows a,.dir a{transition:padding .3s}.feed a:hover,.rows a:hover,.dir a:hover{padding-left:12px}
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s,transform .8s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}
.pq{border-left:0;position:relative}.pq::before{content:"";position:absolute;left:0;top:0;width:5px;height:0;background:var(--acc2);transition:height 1.1s .25s cubic-bezier(.2,.7,.2,1)}.pq.in::before{height:100%}
@keyframes rowin{from{opacity:0;transform:translateY(8px)}}
.btn{transition:transform .25s,background-color .25s}.btn:hover{transform:translateY(-2px)}.btn:active{transform:none}
.chip{transition:background-color .25s,color .25s,border-color .25s,transform .2s}.chip:active{transform:scale(.95)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.w1>i{transform:none}.rv{opacity:1;transform:none}.pq::before{height:100%}}
@media(max-width:900px){
.hero,.two,.news,.prof{grid-template-columns:1fr}.trend{grid-template-columns:1fr 1fr}.trend a:nth-child(3){border-left:0;padding-left:0}
.pq{margin:1.6em 0;font-size:27px}.rel .g{grid-template-columns:1fr}
.rows a,.dir a{grid-template-columns:1fr auto;gap:6px}.rows a p,.dir a p{grid-column:1/-1}
nav{display:none}.bar{gap:12px}.logo{margin-right:auto}.news{padding:30px}.sup{grid-template-columns:1fr 100px}
body{font-size:17px}.body{font-size:19px}
}
@media(prefers-reduced-motion:reduce){.bars rect{animation:none}}


.hero-grid, .hero-grid *, .article-layout, .article-layout * {
  opacity: 1 !important;
  visibility: visible !important;
}
.hero-text-col .mbpin {
  margin: 0 0 18px 0;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

/* ===========================
   BESPOKE FOUNDER STORY (Kishan Panchal)
   =========================== */
:root { --script: 'Caveat', cursive; }
.hero-grid{display:grid;grid-template-columns:1fr 1.12fr;gap:44px;align-items:center;padding:24px 0 44px;border-bottom:1px solid var(--line)}
.hero-tag{display:inline-flex;align-items:center;gap:8px;font:700 11.5px var(--hd);letter-spacing:.09em;text-transform:uppercase;color:var(--acc);margin-bottom:16px}
.hero-tag::before{content:'';width:7px;height:7px;border-radius:50%;background:#e09b19}
.hero-title{font-size:clamp(36px,4.3vw,60px);font-weight:800;letter-spacing:-.035em;line-height:1.04;margin:0 0 20px}
.hero-title mark{background:linear-gradient(transparent 52%, #FFE58F 52% 92%, transparent 92%);color:inherit;padding:0 2px}
:root[data-theme="dark"] .hero-title mark{background:linear-gradient(transparent 52%, rgba(255,229,143,.35) 52% 92%, transparent 92%)}
.hero-dek{font:400 19px/1.55 var(--bd);color:var(--mute);margin:0 0 24px;max-width:34em}
.hero-byline{display:flex;align-items:center;gap:12px;padding:16px 0 0;border-top:1px solid var(--line);font:500 13.5px var(--hd);color:var(--mute)}
.hero-byline .av{width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font:800 15px var(--hd);flex-shrink:0}
.hero-byline .author{font:700 14px var(--hd);color:var(--ink)}
.hero-stage{position:relative;display:flex;align-items:center;justify-content:center;padding:10px 0}
.hero-double-portrait{width:100%;max-width:630px;height:auto;display:block;object-fit:contain;filter:drop-shadow(0 14px 34px rgba(0,0,0,.08));transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.hero-stage:hover .hero-double-portrait{transform:scale(1.02)}
.stage-label-founder{position:absolute;top:10%;left:0;z-index:2;line-height:1.15}
.stage-label-founder .script-name{font-family:var(--script);font-size:34px;font-weight:700;color:var(--ink);display:block;transform:rotate(-6deg)}
.stage-label-founder .sub-role{font:600 11.5px var(--hd);color:var(--mute);display:block;margin-top:2px;letter-spacing:-.01em}
.stage-quote-card{position:absolute;top:8%;right:-4px;max-width:185px;padding:12px 14px;background:var(--card,var(--paper));border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.15);z-index:2}
.stage-quote-card .sq-mark{font-family:Georgia,serif;font-size:26px;line-height:1;color:var(--acc2);display:block;margin-bottom:-4px}
.stage-quote-card p{font:italic 400 12.5px/1.4 var(--bd);color:var(--mute);margin:0}
.stage-signature{position:absolute;bottom:13%;right:2%;z-index:2;line-height:0.95;transform:rotate(-7deg);text-align:left;pointer-events:none}
.stage-signature .sig-line1{font-family:var(--script);font-size:42px;font-weight:700;color:var(--ink);display:block;text-shadow:0 1px 2px rgba(255,255,255,.9), 0 0 10px rgba(255,255,255,.7)}
.stage-signature .sig-line2{font-family:var(--script);font-size:42px;font-weight:700;color:var(--ink);display:block;padding-left:14px;text-shadow:0 1px 2px rgba(255,255,255,.9), 0 0 10px rgba(255,255,255,.7)}
:root[data-theme="dark"] .stage-signature .sig-line1,:root[data-theme="dark"] .stage-signature .sig-line2{text-shadow:0 1px 4px rgba(0,0,0,.95), 0 0 12px rgba(0,0,0,.85)}
.breadcrumb{padding:20px 0 6px;font:500 13px var(--hd);color:var(--mute);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.breadcrumb a:hover{color:var(--acc)}
.breadcrumb span.sep{opacity:.45}
.article-layout{display:grid;grid-template-columns:1fr 350px;gap:52px;padding:48px 0 80px;align-items:start}
.story-content{max-width:680px;font-size:19.5px;line-height:1.75}
.story-content h2{font-size:clamp(26px,3vw,34px);font-weight:800;margin:2em 0 .7em;letter-spacing:-.025em;color:var(--ink)}
.story-content p{margin-bottom:1.4em;color:var(--ink)}
.story-content strong{font-family:var(--hd);font-weight:700}
.field-banner-wrap{margin:2.2em 0 2.4em;border-radius:18px;overflow:hidden;box-shadow:0 12px 36px -12px rgba(19,18,43,.18);border:1px solid var(--line);background:var(--card,var(--paper));transition:transform .4s cubic-bezier(.2,.8,.2,1)}
.field-banner-wrap:hover{transform:translateY(-3px)}
.field-banner-wrap img{width:100%;height:auto;display:block}
.stepper-row{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:12px;margin:2em 0 2.5em;padding:4px 0}
.stepper-card{background:var(--card,var(--paper));border:1.5px solid var(--line);border-radius:12px;padding:16px 14px;box-shadow:0 4px 14px rgba(0,0,0,.04);transition:transform .25s,box-shadow .25s;min-height:115px;display:flex;flex-direction:column;justify-content:center}
.stepper-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.08)}
.stepper-card.c-gold{border-top:3.5px solid #f2aa1f;background:color-mix(in srgb,#fef3c7 20%,var(--paper))}
.stepper-card.c-green{border-top:3.5px solid #38a169;background:color-mix(in srgb,#dcfce7 30%,var(--paper))}
.stepper-card.c-emerald{border-top:3.5px solid #2f855a;background:color-mix(in srgb,#e6fffa 30%,var(--paper))}
.stepper-card .st-icon{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:16px;margin-bottom:8px}
.stepper-card.c-gold .st-icon{background:#fef3c7;color:#b45309}
.stepper-card.c-green .st-icon{background:#dcfce7;color:#15803d}
.stepper-card.c-emerald .st-icon{background:#e6fffa;color:#0d9488}
.stepper-card h4{font:700 14px/1.2 var(--hd);margin:0 0 4px;color:var(--ink)}
.stepper-card p{font:500 12px/1.35 var(--hd);color:var(--mute);margin:0}
.stepper-arrow{font:700 20px var(--hd);color:var(--mute);opacity:.6;text-align:center}
.expansion-container{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center;margin:2em 0 2.5em}
.expansion-map-fig img{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 24px rgba(0,0,0,.06))}
.expansion-states-wrap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.state-pill{background:var(--soft);color:var(--ink);font:600 12.5px var(--hd);padding:7px 10px;border-radius:99px;border:1px solid var(--line);text-align:center;white-space:nowrap;transition:background-color .2s,color .2s}
.state-pill:hover{background:var(--acc);color:#fff;border-color:var(--acc)}
.sidebar{position:sticky;top:88px;display:flex;flex-direction:column;gap:24px}
.company-card{background:var(--card,var(--paper));border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 26px -8px rgba(19,18,43,.08)}
.company-header{display:flex;gap:14px;align-items:flex-start;margin-bottom:16px}
.company-icon{width:44px;height:44px;border-radius:12px;background:#dcfce7;color:#166534;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.company-title{font:800 18px/1.2 var(--hd);color:var(--ink);margin:0 0 4px}
.company-subtitle{font:500 12px/1.4 var(--hd);color:var(--mute);margin:0}
.visit-btn-row{display:flex;gap:8px;margin-bottom:18px}
.visit-site-btn{flex:1;background:var(--ink);color:var(--bg);font:700 13px var(--hd);border:0;border-radius:8px;padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:opacity .2s;text-decoration:none}
.visit-site-btn:hover{opacity:.9}

.mbl{display:inline-flex;align-items:center;gap:6px}
.mbnb{display:inline-block;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--ink);color:var(--bg);font:700 12px/20px var(--hd);text-align:center}
.mbnb[hidden]{display:none}.mbnb.bump{animation:mbb .4s cubic-bezier(.3,1.6,.5,1)}
.mbm{display:none;position:relative;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);place-items:center}
.mbm .mbnb{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;line-height:18px;font-size:11px;padding:0 5px}
.mbm:focus-visible,.mbl:focus-visible{outline:3px solid var(--acc);outline-offset:3px}
.mbt{scroll-margin-top:84px}
@media(max-width:900px){.mbm{display:grid}}
</style>
<style id="tourcss">
#tour{position:fixed;inset:0;z-index:95;opacity:0;pointer-events:none;transition:opacity .35s}
#tour.on{opacity:1;pointer-events:auto}
.tsp{position:fixed;left:0;top:0;width:0;height:0;border-radius:14px;box-shadow:0 0 0 9999px rgba(34,36,52,.8),0 0 0 4px #fff,0 0 30px 8px rgba(255,255,255,.4);transition:left .45s cubic-bezier(.3,.9,.3,1),top .45s cubic-bezier(.3,.9,.3,1),width .45s cubic-bezier(.3,.9,.3,1),height .45s cubic-bezier(.3,.9,.3,1),border-radius .3s}
.tsp::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:2px solid var(--acc2);animation:tpulse 1.8s ease-out infinite}
@keyframes tpulse{from{opacity:.9;transform:scale(1)}to{opacity:0;transform:scale(1.3)}}
.ttp{position:fixed;left:0;top:0;width:min(340px,calc(100vw - 32px));background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:18px 18px 14px;box-shadow:0 24px 50px -16px rgba(0,0,0,.5);transition:left .45s cubic-bezier(.3,.9,.3,1),top .45s cubic-bezier(.3,.9,.3,1)}
.ttp .tst,.ttp h3,.ttp p{transition:opacity .17s}.ttp.sw .tst,.ttp.sw h3,.ttp.sw p{opacity:0}
.tst{font:700 11px var(--hd);letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin-bottom:6px}
.ttp h3{margin:0 0 6px;font:700 21px/1.15 var(--hd);letter-spacing:-.02em}.ttp p{margin:0 0 14px;font-size:16px;line-height:1.4;color:var(--mute)}
.tbr{display:flex;align-items:center;gap:10px}.tdt{display:flex;gap:5px;margin:0 auto}.tdt i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:background .3s}.tdt i.on{background:var(--ink)}
.tbt{display:flex;gap:8px}.ttp button{font:600 14px var(--hd);border-radius:99px;padding:8px 16px;cursor:pointer;border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
.ttp button[hidden]{display:none}.ttp .tnx{background:var(--acc);border-color:var(--acc);color:#fff}.ttp .tsk{border-color:transparent;text-decoration:underline;padding-left:0;padding-right:4px}
.ttp button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.tar{position:fixed;left:0;top:0;width:40px;height:50px;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45));transition:left .45s cubic-bezier(.3,.9,.3,1),top .45s cubic-bezier(.3,.9,.3,1),opacity .3s,transform .3s}
.tar svg{display:block;animation:tbo .9s ease-in-out infinite}@keyframes tbo{50%{transform:translateY(-9px)}}
</style>
<style id="masonry">
@media(max-width:700px){
.phero .pbboard{display:block;column-count:2;column-gap:14px;padding-bottom:28px}
.phero .pbboard>.pbcard{break-inside:avoid;-webkit-column-break-inside:avoid;margin:0 0 20px;width:100%;display:flex}
.phero .pbboard>.pbcard.pblead{column-span:all}
.phero .pbboard>.pbcard:nth-child(3n+1) .pbart{min-height:190px!important}
.phero .pbboard>.pbcard:nth-child(3n+2) .pbart{min-height:120px!important}
.phero .pbboard>.pbcard:nth-child(3n) .pbart{min-height:150px!important}
.phero .pbcard h3{font-size:19px!important;line-height:1.1}
.phero .pbquote p{font-size:19px}
.phero .pbcard .pbbig{font-size:48px}
.phero .mbb{display:block;column-count:2;column-gap:14px;padding:26px 12px 8px;min-height:260px}
.phero .mbb>.mbn{position:static;display:block;width:100%;break-inside:avoid;-webkit-column-break-inside:avoid;margin:0 0 22px;transform:rotate(calc(var(--r,0deg) * .5));touch-action:auto}
.phero .mbb>.mbe{column-span:all}
.phero .mbn h3{font-size:17px}
}
</style>
